<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="380" height="380" role="img" aria-label="Illustration of a glucose molecule ring">
  <style>
    .molecule-spin {
      transform-origin: 300px 300px;
      animation: spin 50s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .molecule-spin { animation: none; }
    }
  </style>

  <g class="molecule-spin">
    <!-- ring bonds -->
    <polygon points="300,180 397,235 397,345 300,400 203,345 203,235"
             fill="none" stroke="#231F17" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- substituent bonds -->
    <line x1="300" y1="180" x2="300" y2="120" stroke="#B87E28" stroke-width="2.5"/>
    <line x1="397" y1="235" x2="455" y2="205" stroke="#16646A" stroke-width="2.5"/>
    <line x1="397" y1="345" x2="455" y2="378" stroke="#16646A" stroke-width="2.5"/>
    <line x1="300" y1="400" x2="300" y2="462" stroke="#B23A54" stroke-width="2.5"/>
    <line x1="203" y1="345" x2="145" y2="378" stroke="#16646A" stroke-width="2.5"/>
    <line x1="203" y1="235" x2="145" y2="205" stroke="#B87E28" stroke-width="2.5"/>
    <line x1="300" y1="120" x2="252" y2="92" stroke="#B87E28" stroke-width="2"/>

    <!-- ring atoms -->
    <circle cx="300" cy="180" r="9" fill="#F6EFDC" stroke="#231F17" stroke-width="2.5"/>
    <circle cx="397" cy="235" r="9" fill="#F6EFDC" stroke="#231F17" stroke-width="2.5"/>
    <circle cx="397" cy="345" r="9" fill="#F6EFDC" stroke="#231F17" stroke-width="2.5"/>
    <circle cx="300" cy="400" r="10" fill="#231F17" stroke="#231F17" stroke-width="2.5"/>
    <circle cx="203" cy="345" r="9" fill="#F6EFDC" stroke="#231F17" stroke-width="2.5"/>
    <circle cx="203" cy="235" r="9" fill="#F6EFDC" stroke="#231F17" stroke-width="2.5"/>

    <!-- substituent atoms -->
    <circle cx="300" cy="120" r="7" fill="#F6EFDC" stroke="#B87E28" stroke-width="2.5"/>
    <circle cx="455" cy="205" r="7" fill="#F6EFDC" stroke="#16646A" stroke-width="2.5"/>
    <circle cx="455" cy="378" r="7" fill="#F6EFDC" stroke="#16646A" stroke-width="2.5"/>
    <circle cx="300" cy="462" r="7" fill="#F6EFDC" stroke="#B23A54" stroke-width="2.5"/>
    <circle cx="145" cy="378" r="7" fill="#F6EFDC" stroke="#16646A" stroke-width="2.5"/>
    <circle cx="145" cy="205" r="7" fill="#F6EFDC" stroke="#B87E28" stroke-width="2.5"/>
    <circle cx="252" cy="92" r="6" fill="#F6EFDC" stroke="#B87E28" stroke-width="2"/>
  </g>
</svg>
